services:
  - type: web
    name: 3x3-registration
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: SHEET_API_URL
        sync: false
      - key: SHEET_TOKEN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FREE_JERSEYS
        value: "10"
