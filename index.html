<html lang="en" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3x3 Basketball Competition – Team Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&amp;family=Barlow:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#14181f;--mut:#5d6573;--ln:#d9d4c9;--ac:#e8480c;--acx:#fff;--hero:#0d2b52;--err:#b3202a;--ok:#1d7a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--card:#171c25;--tx:#eef0f3;--mut:#9aa3b2;--ln:#2b3340;--ac:#ff7a45;--acx:#14181f;--hero:#14284a;--err:#ff8a90;--ok:#4fcf8a}}
:root[data-theme="dark"]{--bg:#0e1218;--card:#171c25;--tx:#eef0f3;--mut:#9aa3b2;--ln:#2b3340;--ac:#ff7a45;--acx:#14181f;--hero:#14284a;--err:#ff8a90;--ok:#4fcf8a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Barlow,system-ui,sans-serif}
h1,h2,h3,.brand,.btn,legend,nav a{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}.narrow{max-width:780px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;max-width:1040px;margin:0 auto}
.brand{font-size:26px;font-weight:700;display:flex;align-items:center;gap:9px;color:var(--tx);text-decoration:none}
.ball{width:24px;height:24px;border-radius:50%;background:var(--ac);position:relative;flex:none}
.ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--bg);clip-path:inset(0 0 0 50%)}
.ball::after{clip-path:inset(0 50% 0 0);transform:scaleX(-1)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:18px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--tx);text-decoration:none;cursor:pointer}
nav a[aria-current=page]{background:var(--tx);color:var(--bg)}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:52px 30px 46px;position:relative;overflow:hidden;margin-top:4px}
.hero::after{content:"";position:absolute;right:-110px;top:-110px;width:340px;height:340px;border-radius:50%;border:3px solid rgba(255,255,255,.16);box-shadow:0 0 0 40px rgba(255,255,255,.05)}
.kick{font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ffb08f;margin:0 0 8px}
h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:0 0 14px;font-weight:700}
.hero p.lead{font-size:19px;max-width:560px;margin:0 0 24px;color:#dbe4f2;position:relative;z-index:1}
.btn{display:inline-block;font-size:21px;font-weight:700;letter-spacing:.02em;padding:12px 28px;border-radius:10px;border:0;background:var(--ac);color:var(--acx);cursor:pointer;text-decoration:none;position:relative;z-index:1}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:wait}.btn.alt{background:transparent;color:var(--tx);border:2px solid var(--tx)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6aa0ff;outline-offset:2px}
section.blk{padding:38px 0 6px}h2{font-size:34px;margin:0 0 14px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px}
.card b{display:block;font:700 30px "Barlow Condensed",sans-serif;color:var(--ac);line-height:1.1;margin-bottom:4px}
.card p{margin:0;color:var(--mut)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px 14px 62px;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;font:700 22px "Barlow Condensed",sans-serif}
ul.need{margin:0;padding-left:20px}ul.need li{margin:4px 0}
.cta{text-align:center;padding:34px 0 48px}.cta p{color:var(--mut);margin:0 0 14px}
form{padding:6px 0 40px}.sub{color:var(--mut);margin:0 0 18px}
fieldset{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:14px 16px 16px;margin:0 0 16px}
legend{font-size:24px;font-weight:700;padding:0 8px}legend em{font:400 15px Barlow,sans-serif;color:var(--mut)}
label{display:block;font-weight:600;font-size:14px}
input,select{width:100%;height:46px;margin-top:4px;padding:0 12px;font:inherit;font-weight:400;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.g4{grid-template-columns:1fr 1fr}.g4>label:first-child{grid-column:1/-1}.g2{grid-template-columns:1fr}}
.g5{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr 1.4fr;gap:12px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.tcard{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:0 0 12px}.tcard .th{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:20px}.tcard .th span{font:400 14px Barlow,sans-serif;color:var(--mut)}.btn.sm{font-size:16px;padding:4px 12px}h3.ch{font-size:28px;margin:22px 0 10px}h3.ch span{font:400 15px Barlow,sans-serif;color:var(--mut);margin-left:8px}@media(max-width:680px){.g5{grid-template-columns:1fr 1fr}.g5>label:first-child{grid-column:1/-1}.g3{grid-template-columns:1fr}}
.tl{display:grid;gap:8px;margin-bottom:14px}.tr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;cursor:pointer}.tr input{width:auto;height:auto;margin:0}.tr span{display:flex;flex-direction:column}.tr b{font:700 22px "Barlow Condensed",sans-serif}.tr small{color:var(--mut);font-weight:400}code{font:600 15px ui-monospace,Menlo,monospace;letter-spacing:.05em}
.who{font-size:13px;color:var(--mut);align-self:center;padding:0 6px}
.err{display:block;color:var(--err);font-weight:600;min-height:0;margin-top:2px}
.roles{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.roles label{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}.roles input{width:auto;height:auto;margin:0}
.msg{color:var(--err);font-weight:600;margin:0 0 10px;min-height:1.4em}
.ok{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--ok);border-radius:14px;padding:22px;margin:10px 0 30px}
.ok.warn{border-left-color:var(--ac)}.ref{font:700 34px "Barlow Condensed",sans-serif;color:var(--ac);letter-spacing:.06em}
table{width:100%;border-collapse:collapse;background:var(--card);margin:12px 0}th,td{border:1px solid var(--ln);padding:6px 10px;text-align:left;vertical-align:top;font-size:15px}th{background:var(--bg)}
.scroll{overflow-x:auto}textarea{width:100%;min-height:150px;margin:8px 0;padding:10px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}footer{color:var(--mut);text-align:center;padding:20px;font-size:14px}
@media print{.top,.cta,footer,.row{display:none}}
.tcard .th .fj{font:600 13px Barlow,sans-serif;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;vertical-align:middle;margin-left:6px}
</style><style>artifact-sync,artifact-local{display:contents}</style></head><body>
<header class="top"><a class="brand" href="#"><span class="ball"></span>3x3 Open</a>
<nav aria-label="Main"><a data-nav="home" href="#">Home</a><a data-nav="register" href="#register">Register</a><a id="adm" data-nav="admin" href="#admin">Organiser</a><span id="who" class="who"></span></nav></header>
<main id="app"></main>
<footer>3x3 Basketball Competition · Team registration</footer>
<script>
let CFG={cats:[],teams:[],free:10},KEYS={},picked=null,pickId=null,admin=false,regs=[],last=null;
const api=async(p,o={})=>{try{const r=await fetch('/api/'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch(e){}return{...j,ok:r.ok,status:r.status}}catch(e){return{ok:false,status:0,error:'Network error. Please check your connection and try again.'}}};
const SIZES=['28','30','32','34','36','38','40','42','44','46','48'];
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'';
const rng=c=>'born '+fmt(c.from)+' to '+fmt(c.to);
let pdel=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=()=>location.hash.slice(1)||'home';

function home(){return `<div class="wrap"><div class="hero"><p class="kick">Team registration</p><h1>3x3 Basketball<br>Competition</h1>
<p class="lead">Three players, one basket, ten minutes of non-stop action. Read how the competition and the registration work below, then register your team.</p>
<a class="btn" href="#register">Register your team</a></div>
<section class="blk"><h2>About 3x3</h2><div class="cards">
<div class="card"><b>3 + 1 players</b><p>Three players per team on court. A team may register a fourth player as a substitute.</p></div>
<div class="card"><b>10 minutes or 21</b><p>A game lasts 10 minutes, or ends early when a team reaches 21 points.</p></div>
<div class="card"><b>12-second clock</b><p>One half court and one basket. Shots inside the arc score 1 point, shots beyond it score 2.</p></div></div></section>
<section class="blk"><h2>How registration works</h2><ol class="steps">
<li><b>Read this page</b> so you know what is needed.</li>
<li><b>Click Register</b>, choose your team from the list and enter the secret key the organiser gave you.</li>
<li><b>Add a contact</b>: a parent, the coach or the player themself.</li>
<li><b>Submit</b> and keep your reference code. That is your confirmation.</li></ol></section>
<section class="blk"><h2>Have this ready</h2><div class="card"><ul class="need">
<li>Your team’s <b>secret key</b>, given to you by the organiser. Without it you cannot register.</li>
<li>Every player’s date of birth must fall inside your team’s category range, otherwise the registration is rejected.</li>
<li>For each player: <b>full name, date of birth, chest number, sleeveless size and FIBA ID</b></li>
<li><b>Players 1 to 3 are mandatory.</b> Player 4 is optional.</li>
<li>Each chest number must be different within the team (0 to 99).</li>
<li>One <b>contact person</b> with phone number and email</li></ul></div></section>
<div class="cta"><p>Ready? It takes about five minutes.</p><a class="btn" href="#register">Register your team</a></div></div>`}

const pf=i=>`<fieldset><legend>Player ${i}${i>3?' <em>(optional)</em>':' *'}</legend><div class="g5">
<label>Full name<input id="n${i}" autocomplete="off"><small class="err" id="e-n${i}"></small></label>
<label>Date of birth<input id="d${i}" type="date" max="${today()}"><small class="err" id="e-d${i}"></small></label>
<label>Chest number<input id="c${i}" inputmode="numeric" maxlength="2" placeholder="0 to 99"><small class="err" id="e-c${i}"></small></label>
<label>Sleeveless size<select id="s${i}"><option value="">Select</option>${SIZES.map(s=>`<option>${s}</option>`).join('')}</select><small class="err" id="e-s${i}"></small></label>
<label>FIBA ID<input id="f${i}" autocomplete="off"><small class="err" id="e-f${i}"></small></label></div></fieldset>`;

function form(){return `<div class="wrap narrow"><form onsubmit="return false" novalidate><h1 style="font-size:clamp(34px,6vw,52px);margin-top:14px">Register your team</h1>
<p class="sub">Fields marked * are required. Players 1 to 3 are mandatory; Player 4 is optional.</p>
${teamBox()}
${[1,2,3,4].map(pf).join('')}
<fieldset><legend>Contact person *</legend><div class="g2">
<label>Name<input id="cn" autocomplete="name"><small class="err" id="e-cn"></small></label>
<label>Phone<input id="cp" type="tel" autocomplete="tel"><small class="err" id="e-cp"></small></label>
<label>Email<input id="ce" type="email" autocomplete="email"><small class="err" id="e-ce"></small></label>
<div id="role" tabindex="-1"><label style="margin-bottom:0">This contact is the</label><div class="roles">${['Parent','Coach','Player'].map(r=>`<label><input type="radio" name="role" value="${r}">${r==='Player'?'Player (themself)':r}</label>`).join('')}</div><small class="err" id="e-role"></small></div></div></fieldset>
<p class="msg" id="msg" role="alert"></p><button class="btn" type="button" data-act="submit" ${CFG.cats.length?'':'disabled'}>Submit registration</button></form></div>`}

function read(){const g=id=>{const e=$('#'+id);return e?(e.value||'').trim():''},r=$('input[name=role]:checked');
 return{team:picked.name,cat:picked.cat,players:[1,2,3,4].map(i=>({name:g('n'+i),dob:g('d'+i),chest:g('c'+i),size:g('s'+i),fiba:g('f'+i)})),contact:{name:g('cn'),role:r?r.value:'',phone:g('cp'),email:g('ce')}}}
const filled=p=>p.name||p.dob||p.chest||p.size||p.fiba;
function check(d){const e={};
 if(d.team.length<2)e.team='Enter your team name.';
 const cat=CFG.cats.find(c=>c.id===d.cat);if(!cat)e.cat='Choose a category.';
 d.players.forEach((p,k)=>{const i=k+1;if(i<=3||filled(p)){
  if(p.name.length<2)e['n'+i]='Enter the player’s full name.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.dob)||isNaN(new Date(p.dob)))e['d'+i]='Enter the date of birth.';
  else if(p.dob>today())e['d'+i]='Date of birth cannot be in the future.';
  else if(cat&&(p.dob<cat.from||p.dob>cat.to))e['d'+i]='Not eligible for '+cat.name+' ('+rng(cat)+').';
  if(!/^\d{1,2}$/.test(p.chest))e['c'+i]='Enter a number from 0 to 99.';
  if(!SIZES.includes(p.size))e['s'+i]='Choose a sleeve size.';
  if(p.fiba.length<3)e['f'+i]='Enter the FIBA ID.'}});
 const f=d.players.map((p,k)=>[p,k+1]).filter(([p])=>filled(p));
 f.forEach(([p,i])=>f.forEach(([q,j])=>{if(j<i){if(p.chest&&p.chest===q.chest&&!e['c'+i])e['c'+i]='Same chest number as Player '+j+'.';
  if(p.fiba&&p.fiba.toLowerCase()===q.fiba.toLowerCase()&&!e['f'+i])e['f'+i]='Same FIBA ID as Player '+j+'.'}}));
 const c=d.contact;
 if(c.name.length<2)e.cn='Enter the contact’s name.';
 if(!c.role)e.role='Choose who the contact is.';
 if(!/^[+()\d\s-]{7,20}$/.test(c.phone))e.cp='Enter a valid phone number.';
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email))e.ce='Enter a valid email address.';
 return e}

function catMgr(){return `<section class="blk" style="padding-top:6px"><h2>Categories</h2><p class="sub">A team can only register if every player’s date of birth falls inside its category range.</p>
<div class="card"><div class="g3"><label>Category name<input id="kn" placeholder="e.g. Under 14 boys"></label><label>Born on or after<input id="kf" type="date"></label><label>Born on or before<input id="kt" type="date"></label></div><p class="msg" id="kmsg" style="margin-top:10px"></p><button class="btn" data-act="addcat">Add category</button></div>
<div class="scroll"><table><tr><th>Category</th><th>Date of birth range</th><th>Teams</th><th></th></tr>${CFG.cats.map(c=>`<tr><td>${esc(c.name)}</td><td>${fmt(c.from)} to ${fmt(c.to)}</td><td>${regs.filter(r=>r.cat&&r.cat.id===c.id).length}</td><td><button class="btn alt sm" data-act="delcat" data-id="${esc(c.id)}" ${CFG.teams.some(t=>t.cat===c.id)?'disabled title="Used by a team"':''}>${pdel===c.id?'Tap again':'Delete'}</button></td></tr>`).join('')||'<tr><td colspan="4">No categories yet. Add one so teams can register.</td></tr>'}</table></div></section>`}

function catName(id){return (CFG.cats.find(c=>c.id===id)||{name:'No category'}).name}
function teamPick(){const T=CFG.teams;if(!T.length)return `<div class="wrap narrow"><h1 style="font-size:clamp(34px,6vw,52px);margin-top:14px">Register your team</h1><div class="card">Registration is not open yet: the organiser has not added any teams.</div></div>`;
 return `<div class="wrap narrow"><h1 style="font-size:clamp(34px,6vw,52px);margin-top:14px">Register your team</h1><p class="sub">Choose your team from the list and enter the secret key the organiser gave you.</p>
<div class="tl">${T.map(t=>`<label class="tr"><input type="radio" name="tm" value="${esc(t.id)}" ${pickId===t.id?'checked':''}><span><b>${esc(t.name)}</b><small>${esc(catName(t.cat))}</small></span></label>`).join('')}</div>
<fieldset><legend>Secret key *</legend><label>Secret key<input id="sk" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX"><small class="err" id="e-sk"></small></label></fieldset>
<p class="msg" id="msg" role="alert"></p><button class="btn" data-act="unlock">Continue</button></div>`}
function teamBox(){const c=CFG.cats.find(x=>x.id===picked.cat);return `<fieldset><legend>Team</legend><b style="font:700 28px 'Barlow Condensed',sans-serif">${esc(picked.name)}</b> · ${esc(c?c.name:'No category')}<p class="sub" style="margin:6px 0 10px">${c?'Every player must be '+rng(c)+'.':'This team has no valid category. Ask the organiser.'}</p><button class="btn alt sm" type="button" data-act="back">Change team</button></fieldset>`}
function teamMgr(){return `<section class="blk" style="padding-top:6px"><h2>Teams and secret keys</h2><p class="sub">Add each team here and give it its secret key. Without the key a team cannot register.</p>
<div class="card"><div class="g3"><label>Team name<input id="tn" autocomplete="off"></label><label>Category<select id="tc"><option value="">Select</option>${CFG.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label></div><p class="msg" id="tmsg" style="margin-top:10px"></p><button class="btn" data-act="addteam">Add team</button></div>
<div class="scroll"><table><tr><th>Team</th><th>Category</th><th>Secret key</th><th>Registered</th><th></th></tr>${CFG.teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(catName(t.cat))}</td><td><code>${esc(KEYS[t.id]||'…')}</code></td><td>${regs.filter(r=>r.teamId===t.id).length?'Yes':'No'}</td><td><button class="btn alt sm" data-act="newkey" data-id="${esc(t.id)}">New key</button> <button class="btn alt sm" data-act="delteam" data-id="${esc(t.id)}">${pdel===t.id?'Tap again':'Delete'}</button></td></tr>`).join('')||'<tr><td colspan="5">No teams yet.</td></tr>'}</table></div></section>`}

async function submit(){const d=read(),er=check(d),ks=Object.keys(er);$$('.err').forEach(x=>x.textContent='');
 if(ks.length){ks.forEach(k=>{const el=$('#e-'+k);if(el)el.textContent=er[k]});const f=$('#'+ks[0]);if(f)f.focus();$('#msg').textContent='Please fix the fields marked in red.';return}
 $('#msg').textContent='';const b=$('[data-act=submit]');b.disabled=true;b.textContent='Submitting…';
 const r=await api('register',{method:'POST',body:{teamId:picked.id,key:picked.key,players:d.players.filter(filled),contact:d.contact}});
 if(!r.ok){b.disabled=false;b.textContent='Submit registration';if(r.errors)Object.keys(r.errors).forEach(k=>{const el=$('#e-'+k);if(el)el.textContent=r.errors[k]});$('#msg').textContent=r.error||'Please fix the fields marked in red.';return}
 last={rec:r.rec,pos:r.pos,free:r.free};render();scrollTo(0,0)}
function done(){const{rec,pos,free}=last;
 return `<div class="wrap narrow"><div class="ok"><h2>Registration received</h2><p>Thank you. Keep this reference code as your confirmation.</p><div class="ref">${esc(rec.ref)}</div>
<p><b>Your team is number ${pos} in ${esc(rec.cat.name)}.</b> ${free?'You are among the first '+CFG.free+' teams, so your team gets free jerseys.':'Free jerseys were for the first '+CFG.free+' teams in each category.'}</p>
<div class="scroll"><table><tr><th>Team</th><td colspan="4">${esc(rec.team)} · ${esc(rec.cat.name)}</td></tr>${rec.players.map((p,i)=>`<tr><th>Player ${i+1}</th><td>${esc(p.name)}</td><td>Born ${fmt(p.dob)}</td><td>Chest ${esc(p.chest)} · Size ${esc(p.size)}</td><td>FIBA ID ${esc(p.fiba)}</td></tr>`).join('')}
<tr><th>Contact</th><td colspan="4">${esc(rec.contact.name)} (${esc(rec.contact.role)}) · ${esc(rec.contact.phone)} · ${esc(rec.contact.email)}</td></tr></table></div>
<div class="row"><button class="btn alt" data-act="again">Register another team</button><button class="btn alt" onclick="print()">Print</button></div></div></div>`}
async function unlock(){const r=$('input[name=tm]:checked'),k=$('#sk').value,m=$('#msg');$('#e-sk').textContent='';m.textContent='';
 if(!r){m.textContent='Choose your team first.';return}
 const t=CFG.teams.find(x=>x.id===r.value);pickId=t.id;
 if(!k.trim()){$('#e-sk').textContent='Enter the secret key.';return}
 const b=$('[data-act=unlock]');b.disabled=true;b.textContent='Checking…';
 const v=await api('verify',{method:'POST',body:{teamId:t.id,key:k}});
 b.disabled=false;b.textContent='Continue';
 if(!v.ok){$('#e-sk').textContent=v.error||'That key is not correct for '+t.name+'.';return}
 picked={...t,key:k};render();scrollTo(0,0)}
const tcard=r=>{const c=r.contact||{};return `<div class="tcard"><div class="th"><b>#${r.pos} ${esc(r.team)}${r.free?' <span class="fj">Free jersey</span>':''}</b><span>${esc(r.ref)} · ${new Date(r.at).toLocaleString()}</span></div><div class="scroll"><table><tr><th>#</th><th>Player</th><th>Born</th><th>Chest</th><th>Size</th><th>FIBA ID</th></tr>${(r.players||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${fmt(p.dob)}</td><td>${esc(p.chest)}</td><td>${esc(p.size)}</td><td>${esc(p.fiba)}</td></tr>`).join('')}</table></div><p class="sub" style="margin:0">Contact: ${esc(c.name)} (${esc(c.role)}) · ${esc(c.phone)} · ${esc(c.email)}</p></div>`};
function adminV(){const keys=[];regs.forEach(r=>{if(!keys.includes(r.cat.id))keys.push(r.cat.id)});
 const grp=keys.map(k=>{const L=regs.filter(r=>r.cat.id===k),c=L[0].cat;return `<h3 class="ch">${esc(c.name)}<span>${c.from?rng(c)+' · ':''}${L.length} team${L.length===1?'':'s'}</span></h3>${L.map(tcard).join('')}`}).join('');
 return `<div class="wrap"><h1 style="font-size:clamp(34px,6vw,52px);margin-top:14px">Organiser</h1><p class="msg" id="amsg"></p>${catMgr()}${teamMgr()}
<section class="blk"><h2>Registrations</h2><p class="sub">${regs.length} team${regs.length===1?'':'s'} registered, in registration order within each category. The first ${CFG.free} teams in each category get free jerseys.</p>
<div class="row"><a class="btn alt" href="/api/admin/csv">Download CSV</a><button class="btn alt" data-act="reload">Reload from Google Sheet</button></div>${grp||'<div class="card" style="margin-top:12px">No registrations yet.</div>'}</section></div>`}
function loginV(){return `<div class="wrap narrow"><h1 style="font-size:clamp(34px,6vw,52px);margin-top:14px">Organiser login</h1><fieldset><legend>Sign in</legend><div class="g2"><label>Username<input id="au" autocomplete="username"></label><label>Password<input id="ap" type="password" autocomplete="current-password"></label></div></fieldset><p class="msg" id="msg" role="alert"></p><button class="btn" data-act="login">Sign in</button></div>`}
async function loadAdmin(){const r=await api('admin/data');if(r.ok){admin=true;CFG={...CFG,cats:r.cats,free:r.free,teams:r.teams.map(t=>({id:t.id,name:t.name,cat:t.cat}))};KEYS={};r.teams.forEach(t=>KEYS[t.id]=t.key);regs=r.regs}else{admin=false}render()}
async function login(){const r=await api('admin/login',{method:'POST',body:{username:$('#au').value.trim(),password:$('#ap').value}});if(!r.ok){$('#msg').textContent=r.error||'Login failed.';return}await loadAdmin()}
async function logout(){await api('admin/logout',{method:'POST'});admin=false;regs=[];KEYS={};const c=await api('config');if(c.ok)CFG={cats:c.cats,teams:c.teams,free:c.free};render()}
async function act(p,method,body){const r=await api(p,{method,body}),m=$('#amsg');if(!r.ok){if(r.status===401){admin=false;render();return false}if(m)m.textContent=r.error||'That did not work.';scrollTo(0,0);return false}await loadAdmin();return true}
const addCat=()=>act('admin/category','POST',{name:$('#kn').value,from:$('#kf').value,to:$('#kt').value});
const addTeam=()=>act('admin/team','POST',{name:$('#tn').value,cat:$('#tc').value});
const newKey=id=>act('admin/team/'+id+'/key','POST');
function twice(id,fn){if(pdel!==id){pdel=id;render();return}pdel=null;fn()}
const delCat=id=>twice(id,()=>act('admin/category/'+id,'DELETE'));
const delTeam=id=>twice(id,()=>act('admin/team/'+id,'DELETE'));
function render(){const r=R();$$('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===r?'page':'false'));
 $('#who').innerHTML=admin?'Organiser · <a href="#" data-act="logout">Sign out</a>':'';
 $('#app').innerHTML=r==='register'?(last?done():picked?form():teamPick()):r==='admin'?(admin?adminV():loginV()):home()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='submit')submit();else if(a==='unlock')unlock();else if(a==='back'){picked=null;render()}else if(a==='again'){last=null;picked=null;render();scrollTo(0,0)}
 else if(a==='login')login();else if(a==='logout'){e.preventDefault();logout()}else if(a==='addcat')addCat();else if(a==='delcat')delCat(id);else if(a==='addteam')addTeam();else if(a==='newkey')newKey(id);else if(a==='delteam')delTeam(id);else if(a==='reload')act('admin/reload','POST')});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ap')login();else if(e.target.id==='sk')unlock()});
addEventListener('hashchange',()=>{if(R()!=='register'){last=null;picked=null}if(R()==='admin'&&!admin)loadAdmin();else render();scrollTo(0,0)});
render();
(async()=>{const c=await api('config');if(c.ok){CFG={cats:c.cats,teams:c.teams,free:c.free}}if(R()==='admin')loadAdmin();else render()})();
</script></body></html>
